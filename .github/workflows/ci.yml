name: ci
on: [push, pull_request]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Neither job installs requirements.txt. probe.py is stdlib-only by design,
      # and the four implementations need Postgres, Temporal and an OpenAI key,
      # so CI proves the measurement, never the SDKs. See requirements.txt.
      - name: verdict assertions
        run: python test_probe.py
      - name: end-to-end self-test (durable / non-durable / coarse stand-ins)
        run: python probe.py --self-test
      - name: boundaries.py is syntactically valid
        run: python -c "import ast; ast.parse(open('boundaries.py').read())"
      - name: boundaries.py self-test
        run: python boundaries.py --self-test
      - name: boundaries.py still catches this repo's own deliberate defect
        run: |
          python - <<'PY'
          import subprocess, sys
          r = subprocess.run([sys.executable, "boundaries.py", "."],
                             capture_output=True, text=True)
          assert r.returncode == 1, "the unwrapped outline() in inngest_impl went unflagged"
          assert "inngest_impl/index.ts" in r.stdout, r.stdout
          print("ground truth held")
          PY
      - name: boundaries installs as a command
        run: |
          pip install --quiet .
          boundaries --self-test
      - name: boundaries.py finds nothing in its own non-test tree beyond the known defect
        run: |
          python - <<'PY'
          import subprocess, sys
          r = subprocess.run([sys.executable, "boundaries.py", ".", "--json"],
                             capture_output=True, text=True)
          import json
          d = json.loads(r.stdout)
          act = [f for f in d["findings"] if f["kind"] in ("UNPROTECTED", "SHARED")]
          assert len(act) == 1, f"expected exactly the inngest defect, got {act}"
          assert "inngest_impl" in act[0]["file"], act[0]
          print("one finding, and it is the deliberate one")
          PY
      - name: the TypeScript half type-checks
        run: |
          npm ci --silent
          npx tsc --noEmit -p tsconfig.json || npx tsc --noEmit inngest_impl/*.ts
      - name: every documented file exists
        run: |
          python - <<'PY'
          import os, re, sys
          missing = []
          for readme in ("README.md", "inngest_impl/README.md"):
              body = open(readme).read()
              for m in re.finditer(r"(?:npx tsx|python -m |python )([\w./_-]+)", body):
                  ref = m.group(1)
                  path = ref.replace(".", "/") + ".py" if ref.count("/") == 0 and "." not in ref else ref
                  if ref.endswith(".ts") and not os.path.exists(ref):
                      missing.append(f"{readme} -> {ref}")
          print("checked README command targets")
          assert not missing, "README names files that do not exist: " + ", ".join(missing)
          PY
      - name: run-demo.sh gives every implementation its own reset
        run: |
          python - <<'PY'
          src = open("run-demo.sh").read()
          for impl in ("langgraph", "dbos", "temporal", "inngest"):
              block = src.split(f"  {impl})", 1)
              assert len(block) == 2, f"{impl} has no case branch"
              body = block[1].split(";;", 1)[0]
              assert "RESET=" in body, f"{impl} does not declare its own RESET"
          assert src.count("RESET=") >= 4, "fewer than four resets: one is shared again"
          print("four implementations, four resets")
          PY
      - name: probe.py imports nothing outside the stdlib
        run: |
          python - <<'PY'
          import ast, sys
          tree = ast.parse(open("probe.py").read())
          mods = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  mods |= {a.name.split(".")[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                  mods.add(n.module.split(".")[0])
          extra = mods - set(sys.stdlib_module_names)
          print("imports:", sorted(mods))
          assert not extra, f"probe.py grew a third-party import: {extra}"
          PY
